name: Release

on:
  push:
    tags:
      - "v*"

# A job that needs more than reading asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every check a push gets, run again on the tagged commit. Nothing is built
  # for the release, or published, unless they all pass.
  checks:
    uses: ./.github/workflows/rust.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Check that the tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but Cargo.toml has version $version"
            exit 1
          fi

  build:
    needs: [checks, version]
    strategy:
      matrix:
        include:
          # Static, so they run on any Linux, whatever C library it has.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runs: true
          # The Raspberry Pi this is developed on, among others.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            runs: true
          # Built on Apple silicon, which cannot run it.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
            runs: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runs: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check that the program runs and names the tag's version
        if: matrix.runs
        shell: bash
        run: |
          said=$(target/${{ matrix.target }}/release/servio --version)
          echo "$said"
          [ "$said" = "servio ${GITHUB_REF_NAME#v}" ]

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf servio-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release servio

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a servio-${{ matrix.target }}.zip ./target/${{ matrix.target }}/release/servio.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: servio-${{ matrix.target }}
          path: servio-${{ matrix.target }}.*

  # Only after every check and build, so a crate on crates.io always has its
  # programs to go with it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trades the run's identity for a short-lived crates.io token.
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Sign in to crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum servio-*.tar.gz servio-*.zip > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            servio-*.tar.gz
            servio-*.zip
            SHA256SUMS
