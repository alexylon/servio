# cargo-release on this machine, in this order: version, changelog, tests,
# commit, tag, push. The tag starts the release workflow, which checks, builds
# and publishes.
# Reference: https://rust-lang.github.io/cargo-release/

pre-release-commit-message = "Release {{version}}"

tag-name = "v{{version}}"
tag-message = "Release {{version}}"

# The release workflow publishes, once every check on the tagged commit passes.
publish = false

push = true
push-remote = "origin"

consolidate-commits = false

# The tests, before the release commit; a failure stops the release. They build
# in their own directory: packaging leaves a copy of the crate in target/package,
# which a build in target can take for the source when the same version is tried
# again, so the tests would run the old code.
pre-release-hook = ["cargo", "test", "--locked", "--target-dir", "target/release-tests"]

# Move whatever is under Unreleased into a section for this version.
[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "(?m)^## \\[Unreleased\\]\\n\\n"
replace = """## [Unreleased]

## [{{version}}] - {{date}}

"""
