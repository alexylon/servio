[package]
name = "servio"
version = "0.6.2"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "HTTP server for static files, with live reload for local development and a production mode for finished sites"
authors = ["Alexander Alexandrov"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/alexylon/servio"
documentation = "https://docs.rs/servio"
keywords = ["http", "server", "static-files", "live-reload", "dev-server"]
categories = ["command-line-utilities", "web-programming::http-server", "development-tools"]
publish = true
exclude = [".github/"]

[[bin]]
name = "servio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
clap = { version = "4", features = ["derive"] }
tower-livereload = "0.10"
# Not 0.7 or 0.8.0-rc.2: they hold back repeated changes to one file until the
# changes stop. On Windows, which reports every write alike, a file written
# without pause refreshes the browser only once it pauses. Tests on macOS and
# Linux cannot show this, so check on Windows before upgrading.
notify-debouncer-full = "0.6"
http = "1"
# Tells one directory from another; notify already builds it.
file-id = "0.2"
# Finds the browser, on each system's own terms.
open = "5"
# Reads the patterns given to --ignore.
globset = "0.4"
# Decodes addresses and encodes links as the file service does; tower-http
# already uses it.
percent-encoding = "2"
# Reads the dates browsers send back when they check a copy; tower-http already
# uses it.
httpdate = "1"

[profile.release]
lto = true
